<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>You're offline · REIGN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, #1c1b19, #09090b 70%) #09090b; color: #f2efe8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
  main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .3em; font-size: 14px; color: #e3b75a; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  p { color: rgba(242,239,232,.65); line-height: 1.5; }
  button { margin-top: 6px; border: 0; border-radius: 999px; padding: 14px 28px; font: 600 15px/1 inherit; background: #f2efe8; color: #09090b; cursor: pointer; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<main>
  <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5 4.6 7.2l4.6 4.6L12 4.5l2.8 7.3 4.6-4.6L21 18.5z" fill="currentColor"/><rect x="3" y="19.8" width="18" height="2.2" rx="1.1" fill="currentColor" opacity=".6"/></svg>REIGN</div>
  <h1>You're offline</h1>
  <p>REIGN needs a connection to show live rankings and votes. Check your signal and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  // Phones often report "online" a moment before the connection really works.
  // So: check that REIGN actually answers before reloading, and keep checking every few seconds.
  (function () {
    var busy = false;
    function check() {
      if (busy) return; busy = true;
      fetch("/manifest.webmanifest", { cache: "no-store" })
        .then(function (r) { if (r.ok) location.reload(); })
        .catch(function () {})
        .then(function () { busy = false; });
    }
    window.addEventListener("online", function () { check(); setTimeout(check, 1500); });
    setInterval(check, 4000);
  })();
</script>
</body>
</html>
